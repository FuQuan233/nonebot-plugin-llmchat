name: Setup Python
description: Setup Python

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.10"

runs:
  using: "composite"
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.11.25"
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - run: uv sync --locked --all-extras --dev
      shell: bash

[project]
name = "nonebot-plugin-llmchat"
version = "0.6.0"
description = "Nonebot AI group chat plugin supporting multiple API preset configurations"
license = { file = "LICENSE" }
authors = [{ name = "FuQuan", email = "i@fuquan.moe" }]
readme = "README.md"
keywords = ["nonebot", "nonebot2", "llm", "ai"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.1,<1.0.0",
    "httpx2>=2.5.0,<3.0.0",
    "nonebot2>=2.2.0,<3.0.0",
    "nonebot-adapter-onebot>=2.0.0,<3.0.0",
    "nonebot-plugin-datastore>=1.3.1,<2.0.0",
    "mcp>=2.3.0,<3.0.0",
    "pillow>=10.0.0",
]

[project.urls]
homepage = "https://github.com/FuQuan233/nonebot-plugin-llmchat"
repository = "https://github.com/FuQuan233/nonebot-plugin-llmchat"
documentation = "https://github.com/FuQuan233/nonebot-plugin-llmchat#readme"

[dependency-groups]
dev = [
    "ruff>=0.8.0,<0.9.0",
    "nonemoji>=0.1.2,<0.2.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pyright>=1.1.0,<2.0.0",
    "uvicorn>=0.30.0",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
    "UP037",  # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [{ root = "./" }]

typeCheckingMode = "standard"
disableBytesTypePromotions = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
